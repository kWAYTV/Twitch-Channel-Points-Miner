name: release

# Publishes a release when the commits pushed to main call for one. Nobody picks
# the version: it follows from the commit messages since the last release.
#
#   fix: ...                      patch   1.5.0 -> 1.5.1
#   feat: ...                     minor   1.5.0 -> 1.6.0
#   a "BREAKING CHANGE:" footer   major   1.5.0 -> 2.0.0
#   docs, chore, refactor, test, ci, build, style   no release
#
# Two jobs: binaries, then image. It runs after ci has passed on main, so a
# commit that fails a check is never released. The image is published here and
# nowhere else, so ghcr.io/<repo>:latest is always the latest release.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

# Releases are made one at a time and never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  binaries:
    name: Version and binaries
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Measured: 70 seconds for a release with five binaries.
      BUDGET_SECONDS: 105
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      tag: ${{ steps.version.outputs.new_tag }}
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: ./.github/actions/go
        with:
          cache: build
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      # Before any tag exists, so a broken build config cannot leave a version
      # behind with no release.
      - name: Check the release config
        run: goreleaser check --config ci/goreleaser.yaml

      # Reads the commits since the last tag. With nothing to release it creates
      # no tag, and the release steps and the image job are skipped.
      - name: Decide the version
        id: version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ github.token }}
          commit_sha: ${{ github.event.workflow_run.head_sha }}
          release_branches: main
          tag_prefix: v
          default_bump: false

      - name: Write the release notes
        if: steps.version.outputs.new_tag != ''
        env:
          NOTES: ${{ steps.version.outputs.changelog }}
          TAG: ${{ steps.version.outputs.new_tag }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          sh ci/release-notes.sh > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        if: steps.version.outputs.new_tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.new_tag }}
        run: |
          git fetch --tags --force
          goreleaser release --config ci/goreleaser.yaml --clean --release-notes "$RUNNER_TEMP/notes.md"

      - name: Budget
        if: always()
        run: sh ci/budget.sh

  image:
    name: Image
    needs: binaries
    if: needs.binaries.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Measured: 86 seconds to build both platforms, push and start the image.
      BUDGET_SECONDS: 130
      IMAGE: ghcr.io/kwaytv/twitch-points-miner
      VERSION: ${{ needs.binaries.outputs.version }}
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.binaries.outputs.tag }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v4

      # 1.6.1 is also published as 1.6 and as latest.
      - name: Minor version
        run: echo "MINOR=${VERSION%.*}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:${{ env.MINOR }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the published image with compose.yaml
        run: sh ci/smoke.sh

      - name: Budget
        if: always()
        run: sh ci/budget.sh
