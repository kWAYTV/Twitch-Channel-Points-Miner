name: ci

# Lint, tests, one build per platform and the image build, none waiting on another. Pull requests
# reuse Go's test cache from main, so only packages a change can reach are run
# again. Pushes to main and merge-queue runs execute every test from scratch, in
# random order.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit on the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.x"

jobs:
  lint:
    name: Format, vet, tidy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Measured: 18 seconds on a cold cache.
      BUDGET_SECONDS: 30
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # The history without file contents, to read the new commits' messages.
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          fetch-depth: 0
      # Versions are derived from commit messages, so a malformed one is an error.
      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh ci/check.sh commits "$BASE" "$HEAD"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-lint-${{ runner.os }}-
      - name: gofmt, go vet, go mod tidy
        run: sh ci/check.sh lint
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-lint-${{ runner.os }}-${{ github.sha }}
      - name: Budget
        if: always()
        run: sh ci/budget.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Measured: 40 seconds on a cold cache, race detector on, both passes.
      BUDGET_SECONDS: 60
      # Everything except a pull request runs the whole suite from scratch.
      CHECK_FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: go-test-${{ runner.os }}-
      - name: go test
        run: sh ci/check.sh test
      # A from-scratch run stores no test results. This second, cacheable pass
      # records them so pull requests can skip packages they did not touch.
      - name: Record test results for pull requests
        if: github.ref == 'refs/heads/main'
        run: CHECK_FULL= sh ci/check.sh test
      # Only main writes the cache, so a pull request cannot seed it with results
      # from code that never merged.
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ github.sha }}
      - name: Budget
        if: always()
        run: sh ci/budget.sh

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with RELEASE_TARGETS in ci/check.sh.
        target: [windows/amd64, linux/amd64, linux/arm64, darwin/amd64, darwin/arm64]
    env:
      # Measured: 29 seconds for the slowest platform on a cold cache.
      BUDGET_SECONDS: 45
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ matrix.target }}-${{ github.sha }}
          restore-keys: go-build-${{ matrix.target }}-
      - name: go build
        run: sh ci/check.sh build ${{ matrix.target }}
      - uses: actions/cache/save@v6
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ matrix.target }}-${{ github.sha }}
      - name: Budget
        if: always()
        run: sh ci/budget.sh

  # The image is published by the release workflow. This builds it for both
  # platforms without publishing, so a change that breaks the Dockerfile fails
  # here and not in the middle of a release.
  image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Measured by the workflow this replaces: 35 to 65 seconds warm, 84 cold.
      BUDGET_SECONDS: 90
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          # Only main writes the cache, as with the Go caches above.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      - name: Budget
        if: always()
        run: sh ci/budget.sh
