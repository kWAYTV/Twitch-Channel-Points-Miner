name: ci

# Four jobs, none waiting on another: lint, tests, build, image.
#
# Pull requests reuse Go's test cache from main, so only packages a change can
# reach are run again. Pushes to main and merge-queue runs execute every test
# from scratch, in random order. Each job fails when it exceeds its time budget.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A newer commit on the same branch replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Measured: 18 seconds on a cold cache.
      BUDGET_SECONDS: 30
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      # The history without file contents, to read the new commits' messages.
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          fetch-depth: 0
      - uses: ./.github/actions/go
        with:
          cache: lint
      # Versions are derived from commit messages, so a malformed one is an error.
      - name: Commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: sh ci/check.sh commits "$BASE" "$HEAD"
      - name: gofmt, go vet, go mod tidy
        run: sh ci/check.sh lint
      - uses: ./.github/actions/go/save
        with:
          cache: lint
      - name: Budget
        if: always()
        run: sh ci/budget.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Measured: 40 seconds on a cold cache, race detector on, both passes.
      BUDGET_SECONDS: 60
      # Everything except a pull request runs the whole suite from scratch.
      CHECK_FULL: ${{ github.event_name != 'pull_request' && '1' || '' }}
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: ./.github/actions/go
        with:
          cache: test
      - name: go test
        run: sh ci/check.sh test
      # A from-scratch run stores no test results. This second, cacheable pass
      # records them so pull requests can skip packages they did not touch.
      - name: Record test results for pull requests
        if: github.ref == 'refs/heads/main'
        run: CHECK_FULL= sh ci/check.sh test
      - uses: ./.github/actions/go/save
        with:
          cache: test
      - name: Budget
        if: always()
        run: sh ci/budget.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Measured: 79 seconds for every released platform on a cold cache.
      BUDGET_SECONDS: 90
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: ./.github/actions/go
        with:
          cache: build
      - name: go build, every released platform
        run: sh ci/check.sh build
      - uses: ./.github/actions/go/save
        with:
          cache: build
      - name: Budget
        if: always()
        run: sh ci/budget.sh

  # The image is published by the release workflow. This builds it for both
  # platforms without publishing, so a change that breaks the Dockerfile fails
  # here and not in the middle of a release.
  image:
    name: Image
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      # Measured: 35 to 74 seconds warm, 84 cold.
      BUDGET_SECONDS: 90
    steps:
      - name: Start the clock
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          filter: blob:none
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          # Only main writes the cache, as with the Go caches.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      - name: Budget
        if: always()
        run: sh ci/budget.sh
