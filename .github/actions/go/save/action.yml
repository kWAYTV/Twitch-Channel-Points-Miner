name: Save the Go cache
description: Saves the build cache, on main only, so a pull request cannot seed it with code that never merged.

inputs:
  cache:
    description: The same name the job passed to the set-up action.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache/save@v6
      if: github.ref == 'refs/heads/main'
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: go-${{ inputs.cache }}-${{ runner.os }}-${{ github.sha }}
