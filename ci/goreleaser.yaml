# Builds the binaries of a release and attaches them to it. The release workflow
# decides the version and writes the notes; this file only says what to build.
version: 2

project_name: TwitchChannelPointsMiner

builds:
  - main: ./cmd/twitch-miner
    env:
      - CGO_ENABLED=0
    # Keep in step with RELEASE_TARGETS in ci/check.sh.
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/kWAYTV/twitch-points-miner/internal/project.Version={{ .Version }}

# Plain binaries, named the way the self-updater looks for them:
# TwitchChannelPointsMiner-<os>-<arch>, with .exe on Windows.
archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

# The notes come from the release workflow.
changelog:
  disable: true
